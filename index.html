<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT应用资产管理系统</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- ===================== 侧边导航 ===================== -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">IT</div>
        <div class="brand-text">
          <strong>应用资产管理</strong>
          <span>Application Asset Mgmt</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="dashboard">
          <span class="nav-ico">▦</span><span>可视化仪表盘</span>
        </button>
        <button class="nav-item" data-view="ledger">
          <span class="nav-ico">▤</span><span>应用资产台账</span>
        </button>
        <button class="nav-item" data-view="classification">
          <span class="nav-ico">⚙</span><span>资产分类配置</span>
        </button>
        <button class="nav-item" data-view="discovery">
          <span class="nav-ico">◎</span><span>自动发现与采集</span>
        </button>
        <button class="nav-item" data-view="license">
          <span class="nav-ico">⌘</span><span>License 管理</span>
        </button>
        <button class="nav-item" data-view="lifecycle">
          <span class="nav-ico">⇄</span><span>生命周期与变更</span>
        </button>
        <button class="nav-item" data-view="topology">
          <span class="nav-ico">◇</span><span>应用拓扑关系</span>
        </button>
        <button class="nav-item" data-view="reports">
          <span class="nav-ico">▥</span><span>报表中心</span>
        </button>
        <button class="nav-item" data-view="compliance">
          <span class="nav-ico">◈</span><span>成本与合规</span>
        </button>
        <button class="nav-item" data-view="audit">
          <span class="nav-ico">☰</span><span>权限与审计</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="env-badge">预览环境 · Prototype</div>
      </div>
    </aside>

    <!-- ===================== 主区域 ===================== -->
    <div class="main">
      <header class="topbar">
        <div class="crumb" id="crumb">可视化仪表盘</div>
        <div class="topbar-tools">
          <div class="global-search">
            <span>⌕</span>
            <input id="globalSearch" type="text" placeholder="搜索应用 / 负责人 / 编号（支持拼音）" />
          </div>
          <button class="icon-btn" title="消息">🔔<i class="dot"></i></button>
          <div class="user">
            <div class="avatar">张</div>
            <div class="user-meta">
              <strong>张管理</strong>
              <span>资产管理员</span>
            </div>
          </div>
        </div>
      </header>

      <main class="view" id="view"><!-- 视图由 app.js 渲染 --></main>
    </div>
  </div>

  <!-- 详情抽屉 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <h3 id="drawerTitle">详情</h3>
      <button class="icon-btn" id="drawerClose">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <!-- 通用提示 -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
